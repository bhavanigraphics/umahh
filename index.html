<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, #ff5f9e55, transparent 30%),
        radial-gradient(circle at 80% 80%, #a855f755, transparent 30%),
        linear-gradient(135deg, #17001f, #4a073b, #15001d);

    position: relative;
    .gf-photo {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 0 20px #ff4d94,
                0 0 50px #ff4d9477;
    margin-bottom: 20px;
    animation: photoAppear 1s ease;
}

@keyframes photoAppear {
    from {
        opacity: 0;
        transform: scale(0.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}
}

/* Background glow */

.glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #ff2f92;
    filter: blur(150px);
    opacity: 0.25;
    animation: glowMove 6s infinite alternate;
}

@keyframes glowMove {
    from {
        transform: translate(-150px, -100px);
    }

    to {
        transform: translate(150px, 100px);
    }
}

/* Main Card */

.card {
    width: min(90%, 500px);
    padding: 45px 30px;
    text-align: center;

    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.25);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border-radius: 30px;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.45),
        inset 0 0 30px rgba(255,255,255,0.05);

    position: relative;
    z-index: 10;

    animation: cardAppear 1.5s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Heart */

.big-heart {
    font-size: 95px;
    display: inline-block;

    filter:
        drop-shadow(0 0 10px #ff4d94)
        drop-shadow(0 0 30px #ff1f75);

    animation:
        heartbeat 1.2s infinite,
        heartFloat 3s ease-in-out infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.15);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.18);
    }

    60% {
        transform: scale(1);
    }
}

@keyframes heartFloat {

    0%,100% {
        translate: 0 0;
    }

    50% {
        translate: 0 -10px;
    }
}

/* Heading */

h1 {
    margin-top: 20px;

    font-size: clamp(38px, 10vw, 60px);

    background: linear-gradient(
        90deg,
        #fff,
        #ff9ecb,
        #fff
    );

    background-size: 200%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: shine 3s linear infinite;
}

@keyframes shine {

    from {
        background-position: 0%;
    }

    to {
        background-position: 200%;
    }
}

/* Typewriter */

.typewriter {
    margin: 18px 0 25px;

    font-size: 20px;
    color: #ffe4f0;

    min-height: 30px;
}

/* Button */

.love-button {

    padding: 15px 35px;

    border: none;
    border-radius: 50px;

    background: linear-gradient(
        135deg,
        #ff3f81,
        #ff78aa
    );

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 30px #ff3f8155;

    transition: 0.3s;

    position: relative;
    overflow: hidden;
}

.love-button:hover {
    transform: scale(1.08);
    box-shadow:
        0 15px 40px #ff3f8180;
}

.love-button:active {
    transform: scale(0.95);
}

/* Hidden message */

.message {

    display: none;

    margin-top: 25px;

    padding: 20px;

    border-radius: 20px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.2);

    animation: messagePop 0.8s ease;
}

.message h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.message p {
    font-size: 17px;
    line-height: 1.6;
    color: #ffeaf3;
}

@keyframes messagePop {

    from {
        opacity: 0;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Falling hearts */

.falling-heart {

    position: fixed;

    top: -30px;

    pointer-events: none;

    animation: fall linear forwards;

    z-index: 2;
}

@keyframes fall {

    from {
        transform:
            translateY(-30px)
            rotate(0deg);

        opacity: 1;
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);

        opacity: 0;
    }
}

/* Stars */

.star {

    position: fixed;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow: 0 0 8px white;

    animation: twinkle 2s infinite alternate;

    z-index: 1;
}

@keyframes twinkle {

    from {
        opacity: 0.2;
        transform: scale(0.5);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* Bottom text */

.footer {

    margin-top: 25px;

    font-size: 13px;

    color: #ffc9df;

    opacity: 0.8;
}

/* Mobile */

@media (max-width: 500px) {

    .card {
        padding: 35px 20px;
    }

    .big-heart {
        font-size: 75px;
    }

    h1 {
        font-size: 42px;
    }

    .typewriter {
        font-size: 17px;
    }

}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

    <div class="big-heart">❤️</div>

    <h1>I Love You</h1>

    <div class="typewriter" id="typing"></div>

    <button class="love-button" onclick="openHeart()">
        Open My Heart 💌
    </button>

    <div class="message" id="message">

        <h2>💕 For You 💕</h2>
        <img src="gf-photo.jpg" class="gf-photo" alt="My Love">

        <p>
            You are not just someone special...
            <br>
            You are the reason behind my smile. 🥰
            <br><br>
            Every moment with you feels beautiful.
            <br>
            I Love You More Than Words Can Say ❤️
        </p>

    </div>

    <div class="footer">
        Made with ❤️ just for you
    </div>

</div>


<script>

/* Typewriter */

const text =
"Somewhere between my heart and my soul... I found you ❤️";

let index = 0;

function typeWriter() {

    if (index < text.length) {

        document.getElementById("typing").innerHTML +=
            text.charAt(index);

        index++;

        setTimeout(typeWriter, 55);
    }
}

typeWriter();


/* Open Heart */

function openHeart() {

    const message =
        document.getElementById("message");

    message.style.display = "block";

    createHeartExplosion();

}


/* Falling Hearts */

function createFallingHeart() {

    const heart =
        document.createElement("div");

    heart.className = "falling-heart";

    const hearts = [
        "❤️",
        "💕",
        "💖",
        "💗",
        "💘",
        "💝",
        "💓"
    ];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}

setInterval(createFallingHeart, 450);


/* Heart Explosion */

function createHeartExplosion() {

    for (let i = 0; i < 30; i++) {

        const heart =
            document.createElement("div");

        heart.innerHTML = "❤️";

        heart.style.position = "fixed";

        heart.style.left = "50%";
        heart.style.top = "50%";

        heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

        heart.style.zIndex = "100";

        heart.style.pointerEvents = "none";

        document.body.appendChild(heart);

        const x =
            (Math.random() - 0.5) * 500;

        const y =
            (Math.random() - 0.5) * 500;

        heart.animate(
            [
                {
                    transform:
                        "translate(-50%, -50%) scale(0)",
                    opacity: 1
                },

                {
                    transform:
                        translate(${x}px, ${y}px) scale(1.5),
                    opacity: 0
                }
            ],
            {
                duration: 1200,
                easing: "ease-out"
            }
        );

        setTimeout(() => {
            heart.remove();
        }, 1200);
    }
}


/* Stars */

for (let i = 0; i < 70; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "vw";

    star.style.top =
        Math.random() * 100 + "vh";

    star.style.animationDelay =
        Math.random() * 2 + "s";

    document.body.appendChild(star);
}

</script>

</body>
</html>
